        // Generate coin positions for a level
        function generateCoins(levelWidth, numCoins) {
            const coins = [];
            const spacing = levelWidth / (numCoins + 1);
            for (let i = 0; i < numCoins; i++) {
                // Alternate between different heights to make them all reachable
                const heightPattern = i % 3;
                let yPos;
                if (heightPattern === 0) {
                    yPos = 350; // Medium height, easily reachable
                } else if (heightPattern === 1) {
                    yPos = 400; // Lower, very easy to reach
                } else {
                    yPos = 300; // Slightly higher, requires good jump
                }
                coins.push({
                    x: spacing * (i + 1) - 10,
                    y: yPos,
                    width: 20,
                    height: 20,
                    collected: false
                });
            }
            return coins;
        }

                    player.velocityY = -player.jumpPower;
                    player.jumpsLeft--;
                    player.onGround = false;
                }
            }

            if (e.code === 'KeyR') {
                if (gameState === 'gameOver') {
                    restartLevel();
                } else if (gameState === 'playing') {
                    restartLevel();
                } else if (gameState === 'won' && (currentLevel === 20 || currentLevel === 30 || currentLevel === 40 || currentLevel === 41)) {
                    currentLevel = 1;
                    totalCoins = 0;
                    highestLevelCompleted = 0; // Reset progress
                    loadLevel(1);
                }
            }

            if (e.code === 'Enter' && gameState === 'won') {
                nextLevel();
            }

            if (e.code === 'Escape') {
                // Return to menu
                gameState = 'menu';
                selectedLevel = currentLevel;
                menuScroll = 0;
            }

            // Menu navigation
            if (gameState === 'menu') {
                if (e.code === 'ArrowUp') {
                    selectedLevel = Math.max(1, selectedLevel - 5);
                    menuScroll = Math.max(-200, menuScroll - 30);
                } else if (e.code === 'ArrowDown') {
                    selectedLevel = Math.min(41, selectedLevel + 5);
                    menuScroll = Math.min(450, menuScroll + 30);
                } else if (e.code === 'ArrowLeft') {
                    selectedLevel = Math.max(1, selectedLevel - 1);
                } else if (e.code === 'ArrowRight') {
                    selectedLevel = Math.min(41, selectedLevel + 1);
                } else if (e.code === 'Enter') {
                    currentLevel = selectedLevel;
                    loadLevel(currentLevel);
                }
            }
        });

                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Level buttons are arranged in 4 rows of 5 levels
                const startX = 150;
                const startY = 200;
                const buttonWidth = 120;
                const buttonHeight = 60;
                const spacingX = 150;
                const spacingY = 90;

                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 5; col++) {
                        const levelNum = row * 5 + col + 1;
                        if (levelNum > 41) break;

                        const x = startX + col * spacingX;
                        const y = startY + row * spacingY - menuScroll;

                        if (mouseX >= x && mouseX <= x + buttonWidth &&
                            mouseY >= y && mouseY <= y + buttonHeight) {
                            // Check if level is locked
                            const isLevelLocked = levelNum > highestLevelCompleted + 1;
                            if (!isLevelLocked) {
                                currentLevel = levelNum;
                                loadLevel(currentLevel);
                            }
                            return;
                        }
                    }
                }
            }
        });

                // Allow progression to bonus levels (testing - no coin requirement)
                currentLevel = 11;

            } else if (currentLevel === 20) {
                // Check if player has 75 coins to unlock super bonus levels (temporarily unlocked for testing)
                currentLevel = 21;

                // Progress to extreme levels
                currentLevel = 31;

            } else if (currentLevel < 10) {
                currentLevel++;

            } else if (currentLevel >= 11 && currentLevel < 20) {
                currentLevel++;

            } else if (currentLevel >= 21 && currentLevel < 30) {

                currentLevel = 41;

            gameState = 'gameOver';
            // Lose 10 coins on death
            totalCoins -= 10;
            if (totalCoins < 0) totalCoins = 0;
            document.getElementById('coinCount').textContent = totalCoins;
        }

        function update() {
            if (gameState !== 'playing') return;

            // Update moving platforms FIRST
            movingPlatforms.forEach(platform => {
                if (platform.axis === 'horizontal') {
                    platform.x += platform.speed * platform.direction;
                    if (platform.x <= platform.minX || platform.x + platform.width >= platform.maxX) {
                        platform.direction *= -1;
                    }
                } else {
                    platform.y += platform.speed * platform.direction;
                    if (platform.y <= platform.minY || platform.y + platform.height >= platform.maxY) {
                        platform.direction *= -1;
                    }
                }
            });

            // Check if player is in water
            player.inWater = false;
            waterBlocks.forEach(water => {
                if (checkCollision(player, water)) {
                    player.inWater = true;
                }
            });

            // Player movement
            if (keys['ArrowLeft']) {
                player.velocityX = -player.speed * (player.inWater ? 0.7 : 1);
            } else if (keys['ArrowRight']) {
                player.velocityX = player.speed * (player.inWater ? 0.7 : 1);
            } else {
                player.velocityX *= friction;
            }

            // Swimming controls
            if (player.inWater) {
                // Apply water resistance
                player.velocityY *= 0.85;

                // Swim up with Space or ArrowUp
                if (keys['Space'] || keys['ArrowUp']) {
                    player.velocityY -= 0.8;
                }

                // Swim down with ArrowDown
                if (keys['ArrowDown']) {
                    player.velocityY += 0.5;
                }

                // Apply reduced gravity in water
                player.velocityY += gravity * 0.3;

                // Limit swimming speed
                if (player.velocityY < -5) player.velocityY = -5;
                if (player.velocityY > 5) player.velocityY = 5;
            } else {
                // Apply normal gravity
                player.velocityY += gravity;
            }

            // Update player position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > levelWidth) player.x = levelWidth - player.width;

            // Keep player in vertical bounds when swimming
            if (player.inWater) {
                if (player.y < 0) {
                    player.y = 0;
                    player.velocityY = 0;
                }
                if (player.y + player.height > canvas.height) {
                    player.y = canvas.height - player.height;
                    player.velocityY = 0;
                }
            }

            // Track max fall speed for fall damage
            if (player.velocityY > maxFallSpeed) {
                maxFallSpeed = player.velocityY;
            }

            // Check honey block collisions first (cancels fall damage!)
            let onHoneyBlock = false;
            honeyBlocks.forEach(honey => {
                if (checkCollision(player, honey)) {
                    const overlapTop = (player.y + player.height) - honey.y;
                    if (overlapTop < 20 && player.velocityY >= 0) {
                        player.y = honey.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                        player.jumpsLeft = 2;
                        onHoneyBlock = true;
                        maxFallSpeed = 0; // Honey cancels fall damage!
                        flungByTornado = false; // Honey saves you from tornado fling!
                    }
                }
            });

            // Check platform collisions (skip during earthquake!)
            if (!onHoneyBlock) {
                player.onGround = false;
            }

            const allPlatforms = [...platforms, ...movingPlatforms, ...bouncePlatforms];

            // Check each platform individually - only skip if in earthquake zone
            if (!onHoneyBlock) {
                allPlatforms.forEach(platform => {
                    // Skip this platform if it's in an earthquake zone
                    if (earthquakeActive && isPlatformInEarthquakeZone(platform)) {
                        return; // Platform disappeared due to nearby earthquake!
                    }

                    if (checkCollision(player, platform)) {
                    const overlapTop = (player.y + player.height) - platform.y;
                    const overlapBottom = (platform.y + platform.height) - player.y;
                    const overlapLeft = (player.x + player.width) - platform.x;
                    const overlapRight = (platform.x + platform.width) - player.x;

                    const minOverlap = Math.min(overlapTop, overlapBottom, overlapLeft, overlapRight);

                    if (minOverlap === overlapTop && player.velocityY >= 0) {
                        player.y = platform.y - player.height;

                        if (bouncePlatforms.includes(platform)) {
                            player.velocityY = -18;
                            maxFallSpeed = 0; // Bounce platforms reset fall damage
                            flungByTornado = false; // Bounce platforms save you too!
                        } else {
                            // FALL DAMAGE CHECK!
                            // If flung by tornado, ANY landing kills you!
                            if (flungByTornado) {
                                handleGameOver(); // Die from tornado fling!
                                return;
                            }
                            // Normal fall damage check
                            if (maxFallSpeed > 20) {
                                handleGameOver(); // Die from fall damage!
                                return;
                            }
                            player.velocityY = 0;
                            maxFallSpeed = 0; // Reset after landing
                            flungByTornado = false; // Safe landing
                        }

                        player.onGround = true;
                        player.jumpsLeft = 2;

                        if (movingPlatforms.includes(platform)) {
                            if (platform.axis === 'horizontal') {
                                player.x += platform.speed * platform.direction;
                            }
                        }
                    }
                    else if (minOverlap === overlapBottom && player.velocityY < 0) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    else if (minOverlap === overlapLeft) {
                        player.x = platform.x - player.width;
                    }
                    else if (minOverlap === overlapRight) {
                        player.x = platform.x + platform.width;
                    }
                }
                });
            }

            // Fall off screen
            if (player.y > canvas.height) {
                handleGameOver();
            }

            // Update goombas
            goombas.forEach((goomba, index) => {
                goomba.x += goomba.speed * goomba.direction;

                if (goomba.x <= goomba.minX || goomba.x + goomba.width >= goomba.maxX) {
                    goomba.direction *= -1;
                }

                if (checkCollision(player, goomba)) {
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= goomba.y + 10) {
                        goombas.splice(index, 1);
                        player.velocityY = -8;
                        // Give player a coin for defeating goomba
                        totalCoins++;
                        levelCoins++;
                        document.getElementById('coinCount').textContent = totalCoins;
                    } else {
                        handleGameOver();
                    }
                }
            });

            // Update spike balls
            spikeBalls.forEach(spike => {
                spike.y += spike.speed * spike.direction;

                if (spike.y <= spike.minY || spike.y + spike.height >= spike.maxY) {
                    spike.direction *= -1;
                }

                if (checkCollision(player, spike)) {
                    handleGameOver();
                }
            });

            // Update flying enemies
            flyingEnemies.forEach(enemy => {
                enemy.x += enemy.speedX * enemy.direction;
                enemy.y += enemy.speedY;

                if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
                    enemy.direction *= -1;
                }

                if (enemy.y <= enemy.minY || enemy.y + enemy.height >= enemy.maxY) {
                    enemy.speedY *= -1;
                }

                if (checkCollision(player, enemy)) {
                    handleGameOver();
                }
            });

            // Check coin collection
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    totalCoins++;
                    levelCoins++;
                    document.getElementById('coinCount').textContent = totalCoins;
                }
            });

            // Check lava collision
            lavaBlocks.forEach(lava => {
                if (checkCollision(player, lava)) {
                    handleGameOver();
                }
            });

            // NEW MECHANICS FOR LEVELS 21-30

            // Rolling rocks on slopes
            rollingRocks.forEach((rock, index) => {
                rock.x += rock.speedX;
                rock.y += rock.speedY;

                // Respawn rocks when they go past maxX
                if (rock.x > rock.maxX) {
                    rock.x = rock.startX || rock.minX;
                    rock.y = rock.startY || rock.y - (rock.maxX - rock.minX);
                }

                // Remove if goes past minX (off left side)
                if (rock.x < rock.minX) {
                    rollingRocks.splice(index, 1);
                }

                if (checkCollision(player, rock)) {
                    handleGameOver();
                }
            });

            // Acid pools (like lava)
            acidPools.forEach(acid => {
                if (checkCollision(player, acid)) {
                    handleGameOver();
                }
            });

            // Acid bubbles (rise up)
            acidBubbles.forEach((bubble, index) => {
                bubble.y -= bubble.speed;

                if (bubble.y < -50) {
                    acidBubbles.splice(index, 1);
                }

                if (checkCollision(player, bubble)) {
                    handleGameOver();
                }
            });

            // Spawn acid bubbles from acid pools
            acidPools.forEach(pool => {
                if (Math.random() < 0.03) {
                    acidBubbles.push({
                        x: pool.x + Math.random() * pool.width,
                        y: pool.y,
                        width: 20,
                        height: 20,
                        speed: 2
                    });
                }
            });

            // Falling sticks from trees
            fallingSticks.forEach((stick, index) => {
                stick.y += stick.speed;
                stick.speed += 0.3; // Gravity

                if (stick.y > 600) {
                    fallingSticks.splice(index, 1);
                }

                if (checkCollision(player, stick)) {
                    handleGameOver();
                }
            });

            // Trigger falling sticks from trees randomly
            trees.forEach(tree => {
                if (Math.random() < 0.02) {
                    // Random colors for sticks
                    const colors = ['#8B4513', '#A0522D', '#CD853F', '#D2691E', '#8B7355', '#DEB887'];
                    const randomColor = colors[Math.floor(Math.random() * colors.length)];

                    fallingSticks.push({
                        x: tree.x + 10,
                        y: tree.y,
                        width: 20,
                        height: 40,
                        speed: 1,
                        color: randomColor
                    });
                }
            });

            // Lava geysers
            lavaGeysers.forEach(geyser => {
                geyser.timer = (geyser.timer || 0) + 1;

                if (geyser.timer > geyser.interval) {
                    geyser.active = true;
                    geyser.activeTimer = (geyser.activeTimer || 0) + 1;

                    if (geyser.activeTimer > 30) {
                        geyser.active = false;
                        geyser.timer = 0;
                        geyser.activeTimer = 0;
                    }
                }

                if (geyser.active && checkCollision(player, { x: geyser.x, y: geyser.y - 400, width: geyser.width, height: 400 })) {
                    handleGameOver();
                }
            });

            // Water geysers (push player up)
            waterGeysers.forEach(geyser => {
                geyser.timer = (geyser.timer || 0) + 1;

                if (geyser.timer > geyser.interval) {
                    geyser.active = true;
                    geyser.activeTimer = (geyser.activeTimer || 0) + 1;

                    if (geyser.activeTimer > 40) {
                        geyser.active = false;
                        geyser.timer = 0;
                        geyser.activeTimer = 0;
                    }
                }

                if (geyser.active && checkCollision(player, { x: geyser.x, y: geyser.y - 500, width: geyser.width, height: 500 })) {
                    player.velocityY = -10;
                    player.y -= 5;
                }
            });

            // Sharks
            sharks.forEach(shark => {
                // Initialize velocityY if not present
                if (shark.velocityY === undefined) shark.velocityY = 0;

                const distanceX = Math.abs(player.x - shark.x);
                const distanceY = Math.abs(player.y - shark.y);
                const totalDistance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                if (totalDistance < shark.detectionRange) {
                    // Chase player in both X and Y directions
                    if (player.x > shark.x) {
                        shark.velocityX = shark.speed;
                    } else {
                        shark.velocityX = -shark.speed;
                    }

                    if (player.y > shark.y) {
                        shark.velocityY = shark.speed * 0.7;
                    } else {
                        shark.velocityY = -shark.speed * 0.7;
                    }

                    shark.chasing = true;
                } else {
                    shark.chasing = false;
                    shark.velocityX *= 0.9;
                    shark.velocityY *= 0.9;
                }

                shark.x += shark.velocityX;
                shark.y += shark.velocityY;

                // Find water block containing this shark and constrain to it
                let waterBounds = null;
                waterBlocks.forEach(water => {
                    if (shark.x >= water.x - 100 && shark.x <= water.x + water.width + 100) {
                        waterBounds = water;
                    }
                });

                if (waterBounds) {
                    // Keep shark within water block
                    if (shark.x < waterBounds.x) {
                        shark.x = waterBounds.x;
                        shark.velocityX = 0;
                    }
                    if (shark.x + shark.width > waterBounds.x + waterBounds.width) {
                        shark.x = waterBounds.x + waterBounds.width - shark.width;
                        shark.velocityX = 0;
                    }
                    if (shark.y < waterBounds.y) {
                        shark.y = waterBounds.y;
                        shark.velocityY = 0;
                    }
                    if (shark.y + shark.height > waterBounds.y + waterBounds.height) {
                        shark.y = waterBounds.y + waterBounds.height - shark.height;
                        shark.velocityY = 0;
                    }
                } else {
                    // Fallback to canvas bounds
                    if (shark.y < 0) {
                        shark.y = 0;
                        shark.velocityY = 0;
                    }
                    if (shark.y + shark.height > canvas.height) {
                        shark.y = canvas.height - shark.height;
                        shark.velocityY = 0;
                    }
                }

                if (checkCollision(player, shark)) {
                    handleGameOver();
                }
            });

            // Float bubbles (push player up)
            let inBubble = false;
            floatBubbles.forEach(bubble => {
                // Convert bubble circle to rectangle for collision
                const bubbleRect = {
                    x: bubble.x,
                    y: bubble.y,
                    width: bubble.radius * 2,
                    height: bubble.radius * 2
                };
                if (checkCollision(player, bubbleRect)) {
                    inBubble = true;
                    player.velocityY -= 1.2; // Push up strongly
                    if (player.velocityY < -6) player.velocityY = -6; // Limit upward speed
                }
            });

            // ===== EXTREME MECHANICS FOR LEVELS 31-40 =====

            // ACID CLOUDS - spawn acid rain drops
            acidClouds.forEach(cloud => {
                cloud.rainTimer++;
                if (cloud.rainTimer > 90) { // Spawn rain every 90 frames (bigger gaps)
                    cloud.rainTimer = 0;
                    // Spawn multiple drops per cloud
                    for (let i = 0; i < 3; i++) {
                        acidRain.push({
                            x: cloud.x + Math.random() * cloud.width,
                            y: cloud.y + cloud.height,
                            width: 8,
                            height: 20,
                            speed: 3 + Math.random() * 1  // 2x slower
                        });
                    }
                }
            });

            // Update acid rain drops
            acidRain.forEach((drop, index) => {
                drop.y += drop.speed;

                // Remove if off screen
                if (drop.y > canvas.height) {
                    acidRain.splice(index, 1);
                }

                // Check collision with player
                if (checkCollision(player, drop)) {
                    handleGameOver();
                }
            });

            // BLIZZARD CLOUDS - spawn hail stones
            blizzardClouds.forEach(cloud => {
                cloud.hailTimer++;
                if (cloud.hailTimer > 75) { // Spawn hail every 75 frames (bigger gaps)
                    cloud.hailTimer = 0;
                    // Spawn multiple hail stones per cloud
                    for (let i = 0; i < 4; i++) {
                        hailStones.push({
                            x: cloud.x + Math.random() * cloud.width,
                            y: cloud.y + cloud.height,
                            width: 12,
                            height: 12,
                            speedY: 3.5 + Math.random() * 1.5,  // 2x slower
                            speedX: (Math.random() - 0.5) * 1  // 2x slower horizontal too
                        });
                    }
                }
            });

            // Update hail stones
            hailStones.forEach((hail, index) => {
                hail.y += hail.speedY;
                hail.x += hail.speedX;

                // Remove if off screen
                if (hail.y > canvas.height || hail.x < 0 || hail.x > levelWidth) {
                    hailStones.splice(index, 1);
                }

                // Check collision with player
                if (checkCollision(player, hail)) {
                    handleGameOver();
                }
            });

            // EARTHQUAKES - create screen shake and ground cracks
            earthquakeActive = false; // Reset each frame
            earthquakeWarning = 0; // Reset warning
            earthquakeZones = []; // Reset zones each frame
            earthquakes.forEach(quake => {
                quake.timer++;

                // WARNING PHASE (3 seconds before earthquake)
                const warningTime = 180; // 3 seconds at 60fps
                if (!quake.active && quake.timer >= (quake.interval - warningTime) && quake.timer < quake.interval) {
                    earthquakeWarning = quake.interval - quake.timer; // Countdown in frames
                }

                if (!quake.active && quake.timer >= quake.interval) {
                    quake.active = true;
                    quake.timer = 0;
                    earthquakeWarning = 0; // Clear warning
                    // Spawn ground cracks and create earthquake zones
                    for (let i = 0; i < 8; i++) {
                        const crackX = Math.random() * levelWidth;
                        const crackY = 540 + Math.random() * 40;
                        groundCracks.push({
                            x: crackX,
                            y: crackY,
                            width: 30 + Math.random() * 40,
                            height: 80,
                            lifetime: quake.duration
                        });
                        // Create earthquake zone around this crack
                        earthquakeZones.push({
                            x: crackX,
                            y: crackY,
                            radius: 350 // Platforms within 350 pixels disappear
                        });
                    }
                }

                if (quake.active) {
                    earthquakeActive = true;
                    // Update earthquake zones from current cracks
                    earthquakeZones = groundCracks.map(crack => ({
                        x: crack.x + crack.width / 2,
                        y: crack.y,
                        radius: 350
                    }));

                    if (quake.timer >= quake.duration) {
                        quake.active = false;
                        quake.timer = 0;
                        groundCracks = []; // Clear all cracks
                        earthquakeZones = []; // Clear all zones
                    } else {
                        // Shake the player during earthquake
                        player.x += (Math.random() - 0.5) * quake.intensity;
                        player.y += (Math.random() - 0.5) * quake.intensity;
                    }
                }
            });

            // Update ground cracks (they're deadly!)
            groundCracks.forEach(crack => {
                crack.lifetime--;
                if (checkCollision(player, crack)) {
                    handleGameOver();
                }
            });

            // GRIZZLY BEARS - chase the player when in range
            grizzlyBears.forEach(bear => {
                const distanceX = Math.abs(player.x - bear.x);
                const distanceY = Math.abs(player.y - bear.y);
                const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                if (distance < bear.detectionRange && distanceY < 100) {
                    bear.chasing = true;
                    // Move toward player
                    if (player.x < bear.x) {
                        bear.direction = -1;
                    } else {
                        bear.direction = 1;
                    }
                } else {
                    bear.chasing = false;
                }

                // Move bear
                const moveSpeed = bear.chasing ? bear.speed * 1.5 : bear.speed;
                bear.x += moveSpeed * bear.direction;

                // Keep bear within bounds
                if (bear.x <= bear.minX) {
                    bear.x = bear.minX;
                    bear.direction = 1;
                }
                if (bear.x + bear.width >= bear.maxX) {
                    bear.x = bear.maxX - bear.width;
                    bear.direction = -1;
                }

                // Check collision with player
                if (checkCollision(player, bear)) {
                    handleGameOver();
                }
            });

            // TORNADOS - pull, spin, and FLING player upward!
            tornados.forEach(tornado => {
                tornado.x += tornado.speedX * tornado.direction;

                // Bounce tornado within bounds
                if (tornado.x <= tornado.minX) {
                    tornado.x = tornado.minX;
                    tornado.direction = 1;
                }
                if (tornado.x + tornado.width >= tornado.maxX) {
                    tornado.x = tornado.maxX - tornado.width;
                    tornado.direction = -1;
                }

                // Calculate distance from player to tornado center
                const tornadoCenterX = tornado.x + tornado.width / 2;
                const tornadoCenterY = tornado.y + tornado.height / 2;
                const distanceX = tornadoCenterX - (player.x + player.width / 2);
                const distanceY = tornadoCenterY - (player.y + player.height / 2);
                const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                // Pull player if within range
                if (distance < tornado.pullRadius) {
                    const pullForce = tornado.pullStrength * (1 - distance / tornado.pullRadius);
                    player.velocityX += (distanceX / distance) * pullForce * 0.3;
                    player.velocityY += (distanceY / distance) * pullForce * 0.3;
                }

                // Direct hit = SPIN and FLING!
                if (checkCollision(player, tornado)) {
                    tornado.spinTimer = (tornado.spinTimer || 0) + 1;

                    // Spin the player around the tornado
                    const angle = tornado.spinTimer * 0.3;
                    const spinRadius = 60;
                    player.x = tornadoCenterX + Math.cos(angle) * spinRadius - player.width / 2;
                    player.y = tornadoCenterY + Math.sin(angle) * spinRadius - player.height / 2;

                    // After 30 frames (0.5 seconds) of spinning, FLING upward!
                    if (tornado.spinTimer >= 30) {
                        player.velocityY = -25; // Powerful upward fling!
                        player.velocityX = (Math.random() - 0.5) * 15; // Random horizontal velocity
                        tornado.spinTimer = 0; // Reset for next victim
                        flungByTornado = true; // Mark player as flung - ANY landing = death!
                    }
                }
            });

            // Check finish line
            if (checkCollision(player, finishLine)) {
                gameState = 'won';
                // Update highest level completed
                if (currentLevel > highestLevelCompleted) {
                    highestLevelCompleted = currentLevel;
                }
            }

            // Update camera to follow player
            camera.x = player.x - canvas.width / 3;
            if (camera.x < 0) camera.x = 0;
            if (camera.x > levelWidth - canvas.width) camera.x = levelWidth - canvas.width;
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Check if a platform is in an earthquake zone
        function isPlatformInEarthquakeZone(platform) {
            if (earthquakeZones.length === 0) return false;

            const platformCenterX = platform.x + platform.width / 2;
            const platformCenterY = platform.y + platform.height / 2;

            for (let zone of earthquakeZones) {
                const distanceX = platformCenterX - zone.x;
                const distanceY = platformCenterY - zone.y;
                const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

                if (distance < zone.radius) {
                    return true; // Platform is in earthquake zone!
                }
            }
            return false;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw menu screen
            if (gameState === 'menu') {
                // Background
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Title
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('MARIO GAME', canvas.width/2, 100);

                // Subtitle
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Arial';
                ctx.fillText('Select a Level - Use Arrow Keys, Scroll, or Click', canvas.width/2, 140);

                // Coin counter
                ctx.font = '18px Arial';
                ctx.fillStyle = '#FFD700';
                ctx.fillText('Coins: ' + totalCoins, canvas.width/2, 170);

                // Draw level buttons in 4 rows of 5
                const startX = 150;
                const startY = 200;
                const buttonWidth = 120;
                const buttonHeight = 60;
                const spacingX = 150;
                const spacingY = 90;

                for (let row = 0; row < 9; row++) {
                    for (let col = 0; col < 5; col++) {
                        const levelNum = row * 5 + col + 1;
                        if (levelNum > 41) break;

                        const x = startX + col * spacingX;
                        const y = startY + row * spacingY - menuScroll;

                        // Determine if level is locked - must complete previous level to unlock
                        const isLocked = levelNum > highestLevelCompleted + 1;
                        const isSelected = levelNum === selectedLevel;

                        // Button background
                        if (isLocked) {
                            ctx.fillStyle = '#555555';
                        } else if (isSelected) {
                            ctx.fillStyle = '#4ecdc4';
                        } else if (levelNum === 41) {
                            ctx.fillStyle = '#FFD700';  // Gold for FINAL BOSS!
                        } else if (levelNum <= 10) {
                            ctx.fillStyle = '#3a86ff';  // Blue for regular levels
                        } else if (levelNum <= 20) {
                            ctx.fillStyle = '#ff6b6b';  // Red for bonus levels
                        } else {
                            ctx.fillStyle = '#9b59b6';  // Purple for super bonus levels
                        }
                        ctx.fillRect(x, y, buttonWidth, buttonHeight);

                        // Button border
                        ctx.strokeStyle = isSelected ? '#fff' : '#000';
                        ctx.lineWidth = isSelected ? 4 : 2;
                        ctx.strokeRect(x, y, buttonWidth, buttonHeight);

                        // Level number
                        if (levelNum === 41) {
                            ctx.fillStyle = '#8B0000';  // Dark red for gold button
                        } else {
                            ctx.fillStyle = isLocked ? '#888888' : '#ffffff';
                        }
                        ctx.font = 'bold 24px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('Level ' + levelNum, x + buttonWidth/2, y + 30);

                        // Level name (for bonus levels)
                        if (levelNum > 10 && levelNum <= 20 && !isLocked) {
                            ctx.font = '10px Arial';
                            const names = ['LAVA LAKE', 'TOWER', 'GAUNTLET', 'PARKOUR', 'MAZE', 'CHAOS', 'SPEED', 'FALLS', 'SWARM', 'FINALE'];
                            ctx.fillText(names[levelNum - 11], x + buttonWidth/2, y + 50);
                        } else if (levelNum > 20 && levelNum <= 30 && !isLocked) {
                            ctx.font = '10px Arial';
                            const names = ['ROLLING', 'ACID PIT', 'FOREST', 'GEYSERS', 'SHARKS', 'BUBBLES', 'MIXED', 'SLOPES', 'TOXIC', 'ULTIMATE'];
                            ctx.fillText(names[levelNum - 21], x + buttonWidth/2, y + 50);
                        } else if (levelNum > 30 && levelNum <= 40) {
                            ctx.font = '10px Arial';
                            const names = ['ACID RAIN', 'BLIZZARD', 'QUAKE', 'BEARS', 'TORNADO', 'ACID&BEAR', 'BLIZ&QUAKE', 'TORN&BEAR', 'TRIPLE', 'APOCALYPSE'];
                            ctx.fillText(names[levelNum - 31], x + buttonWidth/2, y + 50);
                        } else if (levelNum === 41) {
                            ctx.font = 'bold 10px Arial';
                            ctx.fillStyle = '#8B0000';  // Dark red text on gold button
                            ctx.fillText('FINAL BOSS', x + buttonWidth/2, y + 50);
                        }

                        // Lock icon for locked levels
                        if (isLocked) {
                            ctx.font = '20px Arial';
                            ctx.fillText('🔒', x + buttonWidth/2, y + 50);
                        }
                    }
                }

                // Instructions at bottom
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Press ENTER to start | ESC to return to menu during game', canvas.width/2, 570);

                return; // Don't draw game elements
            }

            ctx.save();
            ctx.translate(-camera.x, 0);

            // Draw platforms (only disappear near earthquake zones!)
            ctx.fillStyle = '#8B4513';
            platforms.forEach(platform => {
                // Skip drawing if platform is in earthquake zone
                if (earthquakeActive && isPlatformInEarthquakeZone(platform)) {
                    return; // Don't draw this platform
                }
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
            });

            // Draw moving platforms (only disappear near earthquake zones!)
            ctx.fillStyle = '#654321';
            movingPlatforms.forEach(platform => {
                // Skip drawing if platform is in earthquake zone
                if (earthquakeActive && isPlatformInEarthquakeZone(platform)) {
                    return; // Don't draw this platform
                }
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#4a3319';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);

                ctx.fillStyle = '#ff0';
                ctx.font = '14px Arial';
                if (platform.axis === 'horizontal') {
                    ctx.fillText('←→', platform.x + platform.width/2 - 10, platform.y + 15);
                } else {
                    ctx.fillText('↕', platform.x + platform.width/2 - 5, platform.y + 15);
                }
            });

            // Draw bounce platforms (only disappear near earthquake zones!)
            ctx.fillStyle = '#FFD700';
            bouncePlatforms.forEach(platform => {
                // Skip drawing if platform is in earthquake zone
                if (earthquakeActive && isPlatformInEarthquakeZone(platform)) {
                    return; // Don't draw this platform
                }
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 3;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);

                for (let i = 0; i < 3; i++) {
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(platform.x + 20 + i * 20, platform.y + 5);
                    ctx.lineTo(platform.x + 25 + i * 20, platform.y + 10);
                    ctx.lineTo(platform.x + 20 + i * 20, platform.y + 15);
                    ctx.stroke();
                }
            });

            // Draw honey blocks (save you from fall damage!)
            honeyBlocks.forEach(honey => {
                const gradient = ctx.createLinearGradient(honey.x, honey.y, honey.x, honey.y + honey.height);
                gradient.addColorStop(0, '#FFD700');
                gradient.addColorStop(0.5, '#FFA500');
                gradient.addColorStop(1, '#FF8C00');
                ctx.fillStyle = gradient;
                ctx.fillRect(honey.x, honey.y, honey.width, honey.height);

                // Honeycomb pattern
                ctx.strokeStyle = '#CC8800';
                ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    const x = honey.x + 10 + i * 15;
                    const y = honey.y + 5;
                    ctx.beginPath();
                    for (let j = 0; j < 6; j++) {
                        const angle = (Math.PI / 3) * j;
                        const hx = x + 5 * Math.cos(angle);
                        const hy = y + 5 * Math.sin(angle);
                        if (j === 0) ctx.moveTo(hx, hy);
                        else ctx.lineTo(hx, hy);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            });

            // Draw lava
            lavaBlocks.forEach(lava => {
                const gradient = ctx.createLinearGradient(lava.x, lava.y, lava.x, lava.y + lava.height);
                gradient.addColorStop(0, '#ff4500');
                gradient.addColorStop(0.5, '#ff6347');
                gradient.addColorStop(1, '#ff0000');
                ctx.fillStyle = gradient;
                ctx.fillRect(lava.x, lava.y, lava.width, lava.height);
            });

            // Draw water
            waterBlocks.forEach(water => {
                const gradient = ctx.createLinearGradient(water.x, water.y, water.x, water.y + water.height);
                gradient.addColorStop(0, '#4169E1');
                gradient.addColorStop(0.5, '#1E90FF');
                gradient.addColorStop(1, '#0066CC');
                ctx.fillStyle = gradient;
                ctx.fillRect(water.x, water.y, water.width, water.height);
            });

            // NEW MECHANICS DRAWING

            // Draw slopes
            slopes.forEach(slope => {
                ctx.fillStyle = '#8B7355';
                ctx.beginPath();
                ctx.moveTo(slope.x, slope.y + slope.height);
                ctx.lineTo(slope.x + slope.width, slope.y);
                ctx.lineTo(slope.x + slope.width, slope.y + slope.height);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw rolling rocks
            rollingRocks.forEach(rock => {
                ctx.fillStyle = '#555';
                ctx.beginPath();
                ctx.arc(rock.x + rock.width/2, rock.y + rock.height/2, rock.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw acid pools
            acidPools.forEach(acid => {
                const gradient = ctx.createLinearGradient(acid.x, acid.y, acid.x, acid.y + acid.height);
                gradient.addColorStop(0, '#00ff00');
                gradient.addColorStop(0.5, '#00cc00');
                gradient.addColorStop(1, '#00aa00');
                ctx.fillStyle = gradient;
                ctx.fillRect(acid.x, acid.y, acid.width, acid.height);
            });

            // Draw acid bubbles
            acidBubbles.forEach(bubble => {
                ctx.fillStyle = '#00ff00';
                ctx.beginPath();
                ctx.arc(bubble.x + bubble.width/2, bubble.y + bubble.height/2, bubble.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#00aa00';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Draw trees
            trees.forEach(tree => {
                // Trunk
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(tree.x, tree.y, tree.width, tree.height);
                // Leaves
                ctx.fillStyle = '#228B22';
                ctx.beginPath();
                ctx.arc(tree.x + tree.width/2, tree.y, 30, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw falling sticks
            fallingSticks.forEach(stick => {
                ctx.fillStyle = stick.color || '#8B4513';
                ctx.fillRect(stick.x, stick.y, stick.width, stick.height);
            });

            // Draw lava geysers
            lavaGeysers.forEach(geyser => {
                ctx.fillStyle = '#8B0000';
                ctx.fillRect(geyser.x, geyser.y, geyser.width, geyser.height);

                if (geyser.active) {
                    const gradient = ctx.createLinearGradient(geyser.x, geyser.y - 400, geyser.x, geyser.y);
                    gradient.addColorStop(0, 'rgba(255, 69, 0, 0.3)');
                    gradient.addColorStop(1, 'rgba(255, 69, 0, 0.8)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(geyser.x, geyser.y - 400, geyser.width, 400);
                }
            });

            // Draw water geysers
            waterGeysers.forEach(geyser => {
                ctx.fillStyle = '#4682B4';
                ctx.fillRect(geyser.x, geyser.y, geyser.width, geyser.height);

                if (geyser.active) {
                    const gradient = ctx.createLinearGradient(geyser.x, geyser.y - 500, geyser.x, geyser.y);
                    gradient.addColorStop(0, 'rgba(70, 130, 180, 0.3)');
                    gradient.addColorStop(1, 'rgba(70, 130, 180, 0.8)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(geyser.x, geyser.y - 500, geyser.width, 500);
                }
            });

            // Draw sharks
            sharks.forEach(shark => {
                ctx.fillStyle = shark.chasing ? '#0000CD' : '#4169E1';
                ctx.beginPath();
                ctx.moveTo(shark.x, shark.y + shark.height/2);
                ctx.lineTo(shark.x + shark.width * 0.7, shark.y);
                ctx.lineTo(shark.x + shark.width, shark.y + shark.height/2);
                ctx.lineTo(shark.x + shark.width * 0.7, shark.y + shark.height);
                ctx.closePath();
                ctx.fill();
                // Eye
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(shark.x + shark.width * 0.6, shark.y + shark.height * 0.3, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw float bubbles
            floatBubbles.forEach(bubble => {
                ctx.fillStyle = 'rgba(173, 216, 230, 0.5)';
                ctx.strokeStyle = 'rgba(135, 206, 250, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(bubble.x + bubble.radius, bubble.y + bubble.radius, bubble.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            // Draw coins
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#FFA500';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', coin.x + coin.width/2, coin.y + coin.height/2 + 4);
                }
            });

            // Draw goombas
            goombas.forEach(goomba => {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.arc(goomba.x + goomba.width/2, goomba.y + goomba.height/2, goomba.width/2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(goomba.x + 10, goomba.y + 10, 4, 0, Math.PI * 2);
                ctx.arc(goomba.x + 20, goomba.y + 10, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(goomba.x + 10, goomba.y + 10, 2, 0, Math.PI * 2);
                ctx.arc(goomba.x + 20, goomba.y + 10, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw spike balls
            spikeBalls.forEach(spike => {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(spike.x + spike.width/2, spike.y + spike.height/2, spike.width/2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#111';
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8;
                    const x = spike.x + spike.width/2 + Math.cos(angle) * spike.width/2;
                    const y = spike.y + spike.height/2 + Math.sin(angle) * spike.height/2;
                    const tipX = spike.x + spike.width/2 + Math.cos(angle) * (spike.width/2 + 8);
                    const tipY = spike.y + spike.height/2 + Math.sin(angle) * (spike.height/2 + 8);

                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(tipX, tipY);
                    ctx.lineTo(x + 3, y + 3);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Draw flying enemies
            flyingEnemies.forEach(enemy => {
                ctx.fillStyle = '#8B008B';
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, 0, Math.PI * 2);
                ctx.fill();

                // Wings
                ctx.fillStyle = '#9370DB';
                ctx.beginPath();
                ctx.ellipse(enemy.x, enemy.y + enemy.height/2, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(enemy.x + enemy.width, enemy.y + enemy.height/2, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(enemy.x + 10, enemy.y + 12, 3, 0, Math.PI * 2);
                ctx.arc(enemy.x + 20, enemy.y + 12, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // ===== EXTREME HAZARDS DRAWING (LEVELS 31-40) =====

            // Draw acid clouds
            acidClouds.forEach(cloud => {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.6)';
                ctx.strokeStyle = 'rgba(0, 200, 0, 0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(cloud.x + cloud.width/2, cloud.y + cloud.height/2, cloud.width/2, cloud.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // Add toxic symbol
                ctx.fillStyle = '#000';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('☠', cloud.x + cloud.width/2, cloud.y + cloud.height/2 + 8);
            });

            // Draw acid rain drops
            acidRain.forEach(drop => {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(drop.x, drop.y, drop.width, drop.height);
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                ctx.fillRect(drop.x - 2, drop.y, drop.width + 4, drop.height);
            });

            // Draw blizzard clouds
            blizzardClouds.forEach(cloud => {
                ctx.fillStyle = 'rgba(200, 220, 255, 0.7)';
                ctx.strokeStyle = 'rgba(150, 180, 255, 0.9)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(cloud.x + cloud.width/2, cloud.y + cloud.height/2, cloud.width/2, cloud.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // Add snowflakes
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                for (let i = 0; i < 3; i++) {
                    ctx.fillText('❄', cloud.x + 30 + i * 50, cloud.y + cloud.height/2 + 5);
                }
            });

            // Draw hail stones
            hailStones.forEach(hail => {
                ctx.fillStyle = '#e0f0ff';
                ctx.strokeStyle = '#9ec5ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(hail.x + hail.width/2, hail.y + hail.height/2, hail.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            // Draw earthquake danger zones (red circles showing where platforms disappear)
            if (earthquakeActive) {
                earthquakeZones.forEach(zone => {
                    const pulse = Math.sin(Date.now() * 0.01) * 0.3 + 0.5;
                    ctx.fillStyle = `rgba(255, 0, 0, ${0.15 * pulse})`;
                    ctx.strokeStyle = `rgba(255, 0, 0, ${0.6 * pulse})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                });
            }

            // Draw ground cracks
            groundCracks.forEach(crack => {
                ctx.fillStyle = '#000';
                ctx.fillRect(crack.x, crack.y, crack.width, crack.height);
                // Add jagged edges
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(crack.x, crack.y);
                ctx.lineTo(crack.x + crack.width * 0.3, crack.y + crack.height * 0.3);
                ctx.lineTo(crack.x + crack.width * 0.5, crack.y + crack.height * 0.1);
                ctx.lineTo(crack.x + crack.width * 0.7, crack.y + crack.height * 0.5);
                ctx.lineTo(crack.x + crack.width, crack.y);
                ctx.stroke();
            });

            // Draw grizzly bears
            grizzlyBears.forEach(bear => {
                ctx.fillStyle = bear.chasing ? '#4a2511' : '#654321';
                // Body
                ctx.fillRect(bear.x, bear.y + 20, bear.width, bear.height - 20);
                // Head
                ctx.beginPath();
                ctx.arc(bear.x + bear.width/2, bear.y + 15, 18, 0, Math.PI * 2);
                ctx.fill();
                // Ears
                ctx.beginPath();
                ctx.arc(bear.x + 10, bear.y + 5, 6, 0, Math.PI * 2);
                ctx.arc(bear.x + bear.width - 10, bear.y + 5, 6, 0, Math.PI * 2);
                ctx.fill();
                // Eyes (red if chasing)
                ctx.fillStyle = bear.chasing ? '#ff0000' : '#000';
                ctx.beginPath();
                ctx.arc(bear.x + 15, bear.y + 15, 3, 0, Math.PI * 2);
                ctx.arc(bear.x + bear.width - 15, bear.y + 15, 3, 0, Math.PI * 2);
                ctx.fill();
                // Claws (if chasing)
                if (bear.chasing) {
                    ctx.strokeStyle = '#ff0000';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(bear.x + (bear.direction === 1 ? bear.width : 0), bear.y + 35 + i * 8);
                        ctx.lineTo(bear.x + (bear.direction === 1 ? bear.width + 10 : -10), bear.y + 30 + i * 8);
                        ctx.stroke();
                    }
                }
            });

            // Draw tornados (3x taller now!)
            tornados.forEach(tornado => {
                // Draw spinning tornado effect with more levels for taller tornado
                const numLevels = 30; // More levels for taller tornado
                for (let i = 0; i < numLevels; i++) {
                    const y = tornado.y + (i / numLevels) * tornado.height;
                    const width = tornado.width * (1 - i / (numLevels * 1.5));
                    const alpha = 0.3 + (i / numLevels) * 0.4;
                    const offset = Math.sin(Date.now() * 0.01 + i) * 15;

                    ctx.fillStyle = `rgba(128, 128, 128, ${alpha})`;
                    ctx.beginPath();
                    ctx.ellipse(tornado.x + tornado.width/2 + offset, y, width/2, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw more debris for larger tornado
                ctx.fillStyle = '#333';
                for (let i = 0; i < 12; i++) {
                    const angle = (Date.now() * 0.005 + i) % (Math.PI * 2);
                    const radius = 40 + Math.sin(Date.now() * 0.003 + i) * 20;
                    const heightOffset = (i / 12) * tornado.height;
                    const x = tornado.x + tornado.width/2 + Math.cos(angle) * radius;
                    const y = tornado.y + heightOffset + Math.sin(angle) * radius;
                    ctx.fillRect(x - 3, y - 3, 6, 6);
                }
            });

            // Draw finish line
            ctx.fillStyle = '#000';
            ctx.fillRect(finishLine.x + 5, finishLine.y, 5, finishLine.height);
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.moveTo(finishLine.x + 10, finishLine.y);
            ctx.lineTo(finishLine.x + 50, finishLine.y + 20);
            ctx.lineTo(finishLine.x + 10, finishLine.y + 40);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw player
            ctx.fillStyle = 'red';
            ctx.fillRect(player.x + 6, player.y + 10, 20, 20);
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(player.x + 8, player.y, 16, 12);
            ctx.fillStyle = 'red';
            ctx.fillRect(player.x + 6, player.y - 4, 20, 6);
            ctx.fillStyle = 'blue';
            ctx.fillRect(player.x + 8, player.y + 30, 6, 10);
            ctx.fillRect(player.x + 18, player.y + 30, 6, 10);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 10, player.y + 4, 3, 3);
            ctx.fillRect(player.x + 19, player.y + 4, 3, 3);

            ctx.restore();

            // Draw earthquake warning!
            if (earthquakeWarning > 0 && gameState === 'playing') {
                const secondsLeft = Math.ceil(earthquakeWarning / 60);

                // Pulsing effect
                const pulse = Math.sin(Date.now() * 0.01) * 0.2 + 0.8;

                // Big warning background
                ctx.fillStyle = `rgba(255, 0, 0, ${0.6 * pulse})`;
                ctx.fillRect(0, canvas.height/2 - 100, canvas.width, 200);

                // Warning text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 70px Arial';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 5;
                ctx.strokeText('⚠️ EARTHQUAKE WARNING! ⚠️', canvas.width/2, canvas.height/2 - 20);
                ctx.fillText('⚠️ EARTHQUAKE WARNING! ⚠️', canvas.width/2, canvas.height/2 - 20);

                // Countdown
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 90px Arial';
                ctx.strokeText(secondsLeft + '', canvas.width/2, canvas.height/2 + 60);
                ctx.fillText(secondsLeft + '', canvas.width/2, canvas.height/2 + 60);

                // Instruction
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px Arial';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeText('AVOID THE RED ZONES!', canvas.width/2, canvas.height/2 + 110);
                ctx.fillText('AVOID THE RED ZONES!', canvas.width/2, canvas.height/2 + 110);
            }

            // Draw game state messages
            if (gameState === 'won') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff00';
                ctx.font = '60px Arial';
                ctx.textAlign = 'center';

                if (currentLevel === 10) {
                    ctx.fillText('LEVEL 10 COMPLETE!', canvas.width/2, canvas.height/2 - 30);
                    ctx.font = '30px Arial';
                    ctx.fillText('Press Enter for bonus levels 11-20', canvas.width/2, canvas.height/2 + 20);
                    ctx.fillText('Press ESC to return to menu', canvas.width/2, canvas.height/2 + 60);
                } else if (currentLevel === 20) {
                    ctx.fillText('BONUS LEVELS COMPLETE!', canvas.width/2, canvas.height/2 - 30);
                    ctx.font = '30px Arial';
                    ctx.fillText('Press Enter for SUPER BONUS levels 21-30!', canvas.width/2, canvas.height/2 + 20);
                    ctx.fillText('Press ESC to return to menu', canvas.width/2, canvas.height/2 + 60);
                } else if (currentLevel === 30) {
                    ctx.fillText('SUPER BONUS COMPLETE!', canvas.width/2, canvas.height/2 - 30);
                    ctx.font = '30px Arial';
                    ctx.fillText('Press Enter for EXTREME levels 31-40!', canvas.width/2, canvas.height/2 + 20);
                    ctx.fillText('(Testing mode - levels unlocked)', canvas.width/2, canvas.height/2 + 60);
                    ctx.fillText('Press ESC to return to menu', canvas.width/2, canvas.height/2 + 100);
                } else if (currentLevel === 40) {
                    ctx.fillText('APOCALYPSE CONQUERED!', canvas.width/2, canvas.height/2 - 30);
                    ctx.font = '30px Arial';
                    ctx.fillText('Press Enter for THE FINAL BOSS!', canvas.width/2, canvas.height/2 + 20);
                    ctx.fillText('Level 41 awaits...', canvas.width/2, canvas.height/2 + 60);
                    ctx.fillText('Press ESC to return to menu', canvas.width/2, canvas.height/2 + 100);
                } else if (currentLevel === 41) {
                    ctx.fillText('🏆 FINAL BOSS DEFEATED! 🏆', canvas.width/2, canvas.height/2 - 60);
                    ctx.font = '30px Arial';
                    ctx.fillText('YOU ARE THE ULTIMATE CHAMPION!', canvas.width/2, canvas.height/2);
                    ctx.fillText('You conquered ALL 41 LEVELS!', canvas.width/2, canvas.height/2 + 40);
                    ctx.font = '25px Arial';
                    ctx.fillStyle = '#FFD700';
                    ctx.fillText('Made by Angelo', canvas.width/2, canvas.height/2 + 90);
                    ctx.fillStyle = '#00ff00';
                    ctx.font = '30px Arial';
                    ctx.fillText('Press R to restart from Level 1', canvas.width/2, canvas.height/2 + 130);
                } else {
                    ctx.fillText('LEVEL ' + currentLevel + ' COMPLETE!', canvas.width/2, canvas.height/2);
                    ctx.font = '30px Arial';
                    ctx.fillText('Press Enter for next level', canvas.width/2, canvas.height/2 + 50);
                }
            } else if (gameState === 'gameOver') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0000';
                ctx.font = '60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.font = '30px Arial';
                ctx.fillText('Press R to restart level', canvas.width/2, canvas.height/2 + 50);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        // Don't load a level yet, start at menu
        gameLoop();
    </script>
</body>
</html>
